-7 7m0 0l-7-7m7 7V3"})})]})]})}const Jo=[{id:"safari-4x4-ong-jmal",category:"4*4",categoryLabel:{fr:"Raid 4x4",en:"4x4 Safari"},title:{fr:"Raid 4x4 Safari : Ong Jmal & Décor Star Wars",en:"4x4 Safari: Ong Jmal & Star Wars Film Set"},subtitle:{fr:"Franchissement de grandes dunes, rocher du chameau et Mos Espa",en:"Giant dune bashing, Camel Rock, and the legendary Mos Espa"},description:{fr:"Montez à bord de nos 4x4 Toyota Land Cruiser climatisés pilotés par nos chauffeurs-guides experts du désert. Traversez les pistes mythiques du Paris-Dakar, escaladez les dunes géantes du Sahara et découvrez le rocher en forme de cou de chameau (Ong Jmal) avant d'explorer le village préservé de Mos Espa (Star Wars Episode I).",en:"Board our air-conditioned Toyota Land Cruiser 4x4s piloted by desert-master drivers. Traverse mythical rally tracks, conquer towering Sahara dunes, and witness the Camel Rock (Ong Jmal) before exploring the intact Mos Espa movie village."},duration:{fr:"Demi-journée (4h)",en:"Half-Day (4h)"},difficulty:{fr:"Accessible à tous",en:"Easy / Family friendly"},groupSize:{fr:"4 à 6 personnes par 4x4",en:"4 to 6 guests per 4x4"},priceTnd:180,priceEur:55,highlight:{fr:"Coucher de soleil sur les dunes",en:"Sunset over giant dunes"},image:"images/99.jpg",fallbackImage:"images/99.jpg",included:{fr:["Chauffeur-guide professionnel natif","4x4 climatisé & carburant","Arrêts photos & thé à la menthe","Assurance passagers"],en:["Native professional desert driver","Air-conditioned 4x4 & fuel","Photo stops & hot mint tea","Passenger insurance"]}},{id:"oasis-montagne-chebika-tamerza-mides",category:"oasis",categoryLabel:{fr:"Oasis de Montagne",en:"Mountain Oases"},title:{fr:"Circuit des 3 Oasis : Chebika, Tamerza & Midès",en:"The 3 Mountain Oases: Chebika, Tamerza & Midès"},subtitle:{fr:"Cascades d'eau pure, palmiers perchés et canyons spectaculaires",en:"Fresh mountain springs, cliffside palms, and dizzying canyons"},description:{fr:"Une expédition féerique à la frontière algérienne dans les contreforts de l'Atlas. Randonnez dans les gorges de Chebika au milieu des sources thermales, admirez la grande cascade de Tamerza et le vieux village fantôme, puis contemplez le vertigineux canyon de Midès, théâtre du film 'Le Patient Anglais'.",en:"A mesmerizing journey near the Algerian border. Hike through Chebika's palm canyon with thermal springs, marvel at Tamerza's waterfall and ghost village, and gaze into Midès canyon, filming location of 'The English Patient'."},duration:{fr:"Journée complète (7h)",en:"Full Day (7h)"},difficulty:{fr:"Marche facile",en:"Easy walking"},groupSize:{fr:"Petits groupes ou privé",en:"Small group or private"},priceTnd:220,priceEur:68,highlight:{fr:"Baignade & Canyons grandioses",en:"Fresh natural springs & canyons"},image:"images/88.jpg",fallbackImage:"images/88.jpg",included:{fr:["Transport tout confort en 4x4","Guide francophone passionné","Déjeuner traditionnel berbère inclus","Eau minérale fraîche"],en:["Comfortable 4x4 transport","Passionate multilingual guide","Traditional Berber lunch included","Chilled mineral water"]}},{id:"quad-aventure-dunes",category:"quads",categoryLabel:{fr:"Sensations Quad",en:"Quad Adventure"},title:{fr:"Sensations Quad & Buggy dans les Dunes Sahariennes",en:"Quad & Buggy Adventure in the Sahara Dunes"},subtitle:{fr:"Liberté totale, adrénaline et panoramas à couper le souffle",en:"Pure adrenaline, freedom, and panoramic desert crests"},description:{fr:"Prenez les commandes d'un puissant quad Yamaha ou d'un buggy biplace pour sillonner les crêtes sablonneuses et les plateaux désertiques entourant Tozeur. Encadré par des moniteurs diplômés, ressentez l'ivresse des grands espaces en toute sécurité avec équipement complet.",en:"Take the wheel of a high-performance Yamaha quad or two-seater buggy over golden dunes and wide desert plateaus. Supervised by certified instructors, experience true desert thrill with top-tier safety gear."},duration:{fr:"2 Heures / 3 Heures",en:"2 Hours / 3 Hours"},difficulty:{fr:"Modéré (dès 16 ans conducteur)",en:"Moderate (16+ driver)"},groupSize:{fr:"1 à 10 quads",en:"1 to 10 quads"},priceTnd:150,priceEur:45,highlight:{fr:"Pilotez au crépuscule",en:"Ride at golden twilight"},image:"images/100.jpg",fallbackImage:"images/100.jpg",included:{fr:["Quad / Buggy récent entretenu","Casque, gants, lunettes & chèche","Briefing de pilotage & sécurité","Assistance technique continue"],en:["Modern serviced Quad/Buggy","Helmet, goggles, gloves & chèche scarf","Safety briefing","Continuous technical assistance"]}},{id:"velo-palmeraie-trekking",category:"velo",categoryLabel:{fr:"Trekking & Vélo",en:"Biking & Trekking"},title:{fr:"Éco-Trek & VTT au Cœur de la Palmeraie Millénaire",en:"Eco-Trek & Mountain Biking in the Ancient Palmeraie"},subtitle:{fr:"Sillonnez les sentiers ombragés sous 400 000 palmiers dattiers",en:"Explore shaded trails under 400,000 date palms and brick architecture"},description:{fr:"À vélo tout terrain ou à pied, parcourez les allées secrètes de l'oasis historique de Tozeur. Découvrez le système ingénieux de répartition des eaux conçu par Ibn Chabbat au XIIIe siècle, dégustez les succulentes dattes Deglet Nour chez un agriculteur local et visitez les briqueteries traditionnelles en terre cuite.",en:"By mountain bike or on foot, glide through shaded pathways of Tozeur's historic oasis. Learn about the 13th-century water distribution system by Ibn Chabbat, taste sweet Deglet Nour dates with local farmers, and visit traditional clay brick kilns."},duration:{fr:"3 Heures",en:"3 Hours"},difficulty:{fr:"Facile & relaxant",en:"Easy & relaxing"},groupSize:{fr:"2 à 15 personnes",en:"2 to 15 people"},priceTnd:90,priceEur:28,highlight:{fr:"Dégustation de dattes & jus frais",en:"Fresh dates & palm juice tasting"},image:"images/55.jpg",fallbackImage:"images/55.jpg",included:{fr:["VTT trekking révisé ou accompagnement pédestre","Casque & antivol","Guide botaniste & historien local","Pause gourmande dans un verger"],en:["Trekking mountain bike or walk","Helmet & lock","Local botanist/historian guide","Gourmet orchard break"]}},{id:"chott-el-jerid-aurore",category:"4*4",categoryLabel:{fr:"Émerveillement Nature",en:"Natural Wonder"},title:{fr:"Chott El Jerid : Lever de Soleil sur le Lac Salé",en:"Chott El Jerid: Sunrise Over the Salt Flats"},subtitle:{fr:"Mirages optiques, cristaux scintillants et reflets infinis",en:"Optical mirages, sparkling salt crystals, and infinite horizons"},description:{fr:"Vivez une aurore mystique sur la plus grande plaine saline du Sahara (5 000 km²). Lorsque le soleil émerge de l'horizon, le sel scintille de teintes rose bonbon, pourpre et or. Écoutez le crépitement du sel sous vos pas et admirez les barques figées et les mirages légendaires.",en:"Experience a mystical dawn on North Africa's largest salt flat (5,000 sq km). As the sun rises, crystalline salt radiates in pink, amber, and gold. Listen to the salt crust crackle underfoot and watch surreal desert mirages."},duration:{fr:"Matinée (3h30)",en:"Morning (3h30)"},difficulty:{fr:"Très facile",en:"Very easy"},groupSize:{fr:"Privé ou petit comité",en:"Private or small group"},priceTnd:140,priceEur:42,highlight:{fr:"Spectacle photographique unique",en:"Photographer's dream light"},image:"images/105.jpg",fallbackImage:"images/105.jpg",included:{fr:["Départ matinal avec chauffeur privé","Café turc & thé préparé sur braises","Arrêts aux sources d'eau chaude artésiennes","Séance photo guidée"],en:["Early departure with private driver","Ember-brewed Turkish coffee & tea","Artesian thermal springs stop","Guided photo session"]}},{id:"bivouac-saharien-luxe",category:"evenements",categoryLabel:{fr:"Bivouac & Événements",en:"Bivouac & Events"},title:{fr:"Nuit Nomade VIP en Bivouac Saharien",en:"VIP Nomadic Overnight Saharan Bivouac"},subtitle:{fr:"Tentes berbères tout confort, dîner sous la Voie Lactée et feu de camp",en:"Luxury Berber tents, candlelit feast under the Milky Way, and campfire"},description:{fr:"L'apogée de l'aventure tunisienne. Après une traversée en 4x4 au coucher du soleil, arrivez dans un campement privé niché entre les dunes. Dégustez un festin saharien préparé sur les braises (pain de sable 'Mella', agneau à la gargoulette), bercé par les mélodies du luth et les contes bédouins sous un ciel étoilé pur.",en:"The zenith of authentic Tunisian hospitality. Arrive at sunset at an exclusive camp nestled among pristine dunes. Savor a feast cooked over desert embers (sand bread 'Mella', slow-cooked lamb in clay amphora), with live oud melodies and Bedouin storytelling."},duration:{fr:"2 Jours / 1 Nuit",en:"2 Days / 1 Night"},difficulty:{fr:"Confort & prestige",en:"Comfort & Prestige"},groupSize:{fr:"Dès 2 personnes",en:"From 2 persons"},priceTnd:450,priceEur:135,highlight:{fr:"Ciel étoilé pur & Nuit inoubliable",en:"Milky Way view & camp memories"},image:"images/44.jpg",fallbackImage:"images/44.jpg",included:{fr:["Transferts A/R en 4x4","Tente privative avec literie confortable","Dîner gastronomique saharien & petit-déjeuner","Veillée musicale berbère"],en:["Roundtrip 4x4 transfers","Private tent with cozy bedding","Sahara gourmet dinner & breakfast","Acoustic Berber music night"]}}],Qf=[{id:"chebika",mapQuery:"Chebika oasis, Tozeur Governorate, Tunisia",name:"Chebika (Qasr al-Shams)",tagline:{fr:"L'Oasis suspendue de la montagne",en:"The Hanging Mountain Oasis"},description:{fr:"Ancien poste militaire romain perché sur les parois rocheuses, Chebika est un miracle géologique où des cascades d'eau cristalline jaillissent miraculeusement au pied de falaises arides et de palmiers luxuriants.",en:"Ancient Roman mountain outpost, Chebika is a geological wonder where natural waterfalls burst from arid canyons directly into a lush emerald palm oasis."},image:"images/77.jpg",fallbackImage:"images/77.jpg",badge:{fr:"Incontournable",en:"Must-See"},distance:{fr:"50 km de Tozeur",en:"50 km from Tozeur"}},{id:"ong-jmal",mapQuery:"Ong Jmal, Nefta, Tunisia",name:"Ong Jmal & Mos Espa",tagline:{fr:"Le Cou de Chameau & Star Wars",en:"Camel Rock & Star Wars Galaxy"},description:{fr:"Rocher sculpté par le vent évoquant un dromadaire couché, entouré des décors originaux de la ville de Mos Espa sur la planète Tatooine, construits pour George Lucas au milieu des dunes mobiles.",en:"Wind-sculpted rock resembling a resting camel, surrounded by the authentic Mos Espa sets on planet Tatooine, built for George Lucas amidst rolling desert dunes."},image:"images/102.jpg",fallbackImage:"images/102.jpg",badge:{fr:"Cinéma & Dunes",en:"Film & Dunes"},distance:{fr:"35 km de Tozeur",en:"35 km from Tozeur"}},{id:"chott-el-jerid",mapQuery:"Chott El Djerid, Tunisia",name:"Chott El Jerid",tagline:{fr:"Le Grand Miroir de Sel",en:"The Great Salt Mirror"},description:{fr:"Étendue infinie de sel blanc et de reflets irréels s'étendant sur 5 000 km². Célèbre pour ses mirages mouvants, ses teintes changeantes du pourpre à l'azur et son calme absolu.",en:"Endless 5,000 sq km expanse of white salt and surreal mirages. Famed for optical illusions, vivid purple-to-azure hues, and profound desert silence."},image:"images/105.jpg",fallbackImage:"images/105.jpg",badge:{fr:"Spectacle Naturel",en:"Natural Wonder"},distance:{fr:"20 km de Tozeur",en:"20 km from Tozeur"}},{id:"tamerza-mides",mapQuery:"Tamerza, Tozeur Governorate, Tunisia",name:"Tamerza & Midès",tagline:{fr:"Les Canyons de l'Atlas",en:"Atlas Mountain Gorges"},description:{fr:"Tamerza offre sa grande cascade et les ruines poétiques de son vieux village préservé. Midès dévoile des gorges vertigineuses sculptées par l'érosion, surnommées le Grand Canyon tunisien.",en:"Tamerza features sparkling waterfalls and historic ghost village ruins. Nearby Midès reveals dramatic vertical canyon gorges dubbed the Tunisian Grand Canyon."},image:"images/66.jpg",fallbackImage:"images/66.jpg",badge:{fr:"Paysages Grandioses",en:"Epic Scenery"},distance:{fr:"65 km de Tozeur",en:"65 km from Tozeur"}},{id:"medina-tozeur",mapQuery:"Oul
